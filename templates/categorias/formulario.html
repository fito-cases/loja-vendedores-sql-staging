{% extends 'base.html' %}
{% block titulo %}{% if cod_categoria %}Editar categoria{% else %}Nova categoria{% endif %}{% endblock %}
{% block conteudo %}
{% if cod_categoria %}
<h1>Editar categoria {{ cod_categoria }}</h1>
<form class="campos" method="post" action="{{ url_for('categorias.salvar', cod_categoria=cod_categoria) }}">
{% else %}
<h1>Nova categoria</h1>
<form class="campos" method="post" action="{{ url_for('categorias.incluir') }}">
{% endif %}
  <label for="nome">Nome</label>
  <input id="nome" name="nome" maxlength="50" required value="{{ dados.nome or '' }}">
  <button type="submit">Salvar</button>
</form>
<p><a href="{{ url_for('categorias.lista') }}">Voltar à lista</a></p>
{% endblock %}
