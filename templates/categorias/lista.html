{% extends 'base.html' %}
{% block titulo %}Categorias{% endblock %}
{% block conteudo %}
<h1>Categorias</h1>
<p><a href="{{ url_for('categorias.nova') }}">Nova categoria</a></p>
<table>
  <thead>
    <tr><th class="numero">Código</th><th>Nome</th></tr>
  </thead>
  <tbody>
    {% for categoria in categorias %}
    <tr>
      <td class="numero">{{ categoria.cod_categoria }}</td>
      <td><a href="{{ url_for('categorias.ficha', cod_categoria=categoria.cod_categoria) }}">{{ categoria.nome }}</a></td>
    </tr>
    {% else %}
    <tr><td colspan="2">Nenhuma categoria cadastrada.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
