{% extends 'base.html' %}
{% block titulo %}{% if cod_vendedor %}Editar vendedor{% else %}Novo vendedor{% endif %}{% endblock %}
{% block conteudo %}
{% if cod_vendedor %}
<h1>Editar vendedor {{ cod_vendedor }}</h1>
<form class="campos" method="post" action="{{ url_for('vendedores.salvar', cod_vendedor=cod_vendedor) }}">
{% else %}
<h1>Novo vendedor</h1>
<form class="campos" method="post" action="{{ url_for('vendedores.incluir') }}">
{% endif %}
  <label for="nome">Nome</label>
  <input id="nome" name="nome" maxlength="100" required value="{{ dados.nome or '' }}">
  <label for="cidade">Cidade</label>
  <input id="cidade" name="cidade" maxlength="70" required value="{{ dados.cidade or '' }}">
  <button type="submit">Salvar</button>
</form>
<p><a href="{{ url_for('vendedores.lista') }}">Voltar à lista</a></p>
{% endblock %}
